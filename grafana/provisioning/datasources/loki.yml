apiVersion: 1

# Replicates the built-in Loki datasource from grafana/otel-lgtm and adds a
# derived-field rule that extracts the traceId from log lines and links it to
# Tempo, enabling one-click navigation from a log entry to its distributed trace.
datasources:
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://localhost:3100
    editable: false
    jsonData:
      derivedFields:
        # Matches the OTel "traceId" label attached to every log record by the
        # OpenTelemetry Logback appender (via captureMdcAttributes in
        # logback-spring.xml).  When the otel-lgtm collector pushes log records
        # to Loki it stores MDC/OTel log attributes as Loki labels, so we use
        # matcherType: label to look up the label by name rather than scanning
        # the log line body with a regex.
        - name: TraceID
          matcherType: label
          matcherRegex: traceId
          url: "${__value.raw}"
          datasourceUid: tempo
