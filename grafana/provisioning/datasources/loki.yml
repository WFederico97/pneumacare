apiVersion: 1

# Replicates the built-in Loki datasource from grafana/otel-lgtm and adds a
# derived-field rule that extracts the traceId from log lines and links it to
# Tempo, enabling one-click navigation from a log entry to its distributed trace.
datasources:
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://localhost:3100
    editable: false
    jsonData:
      derivedFields:
        # Matches the correlation pattern logged by Spring Boot's MDC bridge:
        #   [pneumacare,<traceId>,<spanId>]
        # and links the extracted traceId to the Tempo datasource.
        - name: TraceID
          matcherRegex: '"traceId":"([a-f0-9]+)"'
          url: "${__value.raw}"
          datasourceUid: tempo
