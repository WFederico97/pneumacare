apiVersion: 1

# Replicates the built-in Tempo datasource from grafana/otel-lgtm and adds:
#   - tracesToMetrics: opens a Prometheus query panel from a selected span
#   - tracesToLogs:    jumps to Loki log lines for the same time window and service
#   - serviceMap:      topology view backed by Prometheus (span_metrics pipeline)
#   - nodeGraph:       dependency graph in the Explore view
datasources:
  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://localhost:3200
    editable: false
    jsonData:
      httpMethod: GET

      # Trace → Metrics: from a span, open a rate/latency query in Prometheus
      tracesToMetrics:
        datasourceUid: prometheus
        spanStartTimeShift: "-2m"
        spanEndTimeShift: "2m"
        tags:
          - key: service.name
            value: service
          - key: job
        queries:
          - name: "Request rate"
            query: >-
              sum(rate(http_server_requests_milliseconds_count{$$__tags}[5m]))
          - name: "RSBI calculation rate"
            query: >-
              sum(rate(clinical_rsbi_calculation_milliseconds_count{$$__tags}[5m]))
          - name: "PaFi calculation rate"
            query: >-
              sum(rate(clinical_pafi_calculation_milliseconds_count{$$__tags}[5m]))

      # Trace → Logs: jump to Loki for the same service & time window
      tracesToLogs:
        datasourceUid: loki
        spanStartTimeShift: "-1m"
        spanEndTimeShift: "1m"
        tags:
          - key: service.name
            value: job
        lokiSearch: true
        filterByTraceID: true
        filterBySpanID: false

      # Service map topology (requires span-metrics pipeline in the OTel collector)
      serviceMap:
        datasourceUid: prometheus

      # Dependency graph in Explore
      nodeGraph:
        enabled: true

      search:
        hide: false
