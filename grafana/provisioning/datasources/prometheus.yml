apiVersion: 1

# Replicates the built-in Prometheus/Mimir datasource from grafana/otel-lgtm,
# keeping the same UID so that all provisioned dashboards continue to resolve it.
# Exemplars are linked to Tempo so clicking a histogram bar can jump to the trace.
datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://localhost:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      exemplarTraceIdDestinations:
        - name: traceID
          datasourceUid: tempo
