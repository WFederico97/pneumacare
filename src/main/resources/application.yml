spring:
  application:
    name: pneumacare
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # 1. Db config
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mi_base_de_datos}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Flyway (disabled by default in dev; enabled in staging/prod profiles)
  flyway:
    enabled: false
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  # 2. Redis config
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # password: ${REDIS_PASSWORD:} # Uncomment if redis has password enabled

  # 3. OAuth2 Resource Server (JWT)
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH2_ISSUER_URI:http://localhost:9000}

  # 4. Kafka — disabled by default for local dev without Docker.
  #    Set KAFKA_ENABLED=true (and KAFKA_BOOTSTRAP_SERVERS) when running the full stack.
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    admin:
      fail-fast: false          # prevent startup failure if broker is temporarily unreachable
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: "false"
    consumer:
      group-id: ${spring.application.name}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "*"
        spring.json.add.type.headers: "false"
    listener:
      observation-enabled: true  # enables Micrometer observations on @KafkaListener methods

# microservice configuration port
server:
  port: ${APP_PORT:8080}
  # Trust X-Forwarded-For / X-Real-IP headers from the nginx reverse proxy so
  # that SecurityFilter.getRemoteAddr() resolves to the real client IP instead
  # of nginx's container IP, preserving Redis-based per-IP rate-limiting and
  # blacklisting. Tomcat's RemoteIpValve handles the actual header processing.
  forward-headers-strategy: native

# 5. Swagger / OpenAPI configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

# 6. Actuator & Observability
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true
  otlp:
    metrics:
      export:
        # Metrics are accumulated over `step` and sent as a single batch request.
        # This is non-blocking (sent on a background thread) and adds zero latency
        # to clinical calculations or any other business operations.
        url: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
        step: 10s
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
    logging:
      export:
        # Log records are collected by the OpenTelemetry Logback appender
        # (logback-spring.xml) and exported here in batches.
        # The grafana/otel-lgtm collector receives them and pushes to Loki.
        url: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/logs
        step: 10s
  tracing:
    sampling:
      probability: 1.0
  metrics:
    distribution:
      # Publish full histogram buckets (not just count+sum) for these timers.
      # Required for histogram_quantile() PromQL expressions (p50, p95, p99).
      # Enabled selectively to avoid cardinality explosion on high-label metrics.
      percentiles-histogram:
        http.server.requests: true
        clinical.rsbi.calculation: true
        clinical.pafi.calculation: true

# 7. Application properties
app:
  # AES-256-GCM key for transparent PII encryption (Law 25.326).
  # REQUIRED — application will not start if this is missing or invalid.
  # Set via AES_SECRET_KEY environment variable.
  # Generate a key with: openssl rand -base64 32
  security:
    encryption:
      aes-secret-key: ${AES_SECRET_KEY:}
    bootstrap-admin:
      # Disabled by default (dev/test). Staging/prod profiles enable it.
      enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
      username: ${BOOTSTRAP_ADMIN_USERNAME:admin}
      display-name: ${BOOTSTRAP_ADMIN_DISPLAY_NAME:System Administrator}
      # No default — must be supplied in staging/prod. Rotate on first login.
      initial-password: ${PNMC_BOOTSTRAP_ADMIN_PASSWORD:}
  kafka:
    enabled: ${KAFKA_ENABLED:false}
    topics:
      prefix: ${KAFKA_TOPICS_PREFIX:pneumacare.events}
  rate-limit:
    threshold: ${RATE_LIMIT_THRESHOLD:10}
    window-seconds: ${RATE_LIMIT_WINDOW:60}

# 8. Logging - include traceId/spanId in logs
logging:
  pattern:
    correlation: '[${spring.application.name:},%mdc{traceId:-},%mdc{spanId:-}] '
