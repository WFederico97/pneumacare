# Development profile
app:
  security:
    dev-default-icu-id: cccccccc-0000-0000-0000-000000000001
    # Dev-only placeholder so the JWT beans construct locally. NOT a secret —
    # staging/prod supply PNMC_JWT_SECRET from the environment.
    jwt:
      secret: dev-only-insecure-jwt-signing-secret-0123456789
  cors:
    allowed-origins:
      - http://localhost:4200

spring:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  flyway:
    enabled: false
  autoconfigure:
    exclude:
      - org.springframework.boot.security.oauth2.server.resource.autoconfigure.servlet.OAuth2ResourceServerAutoConfiguration
      - org.springframework.boot.security.oauth2.client.autoconfigure.OAuth2ClientAutoConfiguration
      - org.springframework.boot.security.oauth2.client.autoconfigure.servlet.OAuth2ClientWebSecurityAutoConfiguration

management:
  tracing:
    sampling:
      probability: 1.0

logging:
  level:
    wfederico.pneumacare: DEBUG
    org.hibernate.SQL: DEBUG

