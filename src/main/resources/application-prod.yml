# Production profile
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  security:
    bootstrap-admin:
      enabled: true

spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    connect-retries: 3
    connect-retries-interval: 2

management:
  tracing:
    sampling:
      probability: 0.1
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    wfederico.pneumacare: WARN

