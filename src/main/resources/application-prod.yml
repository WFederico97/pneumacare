# Production profile
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true

management:
  tracing:
    sampling:
      probability: 0.1
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    wfederico.pneumacare: WARN

