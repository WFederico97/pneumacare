# =============================================================================
# Production-profile stack for the PneumaCare backend.
#
#   docker compose -p pneumacare-prod -f compose.prod.yaml --env-file .env.prod up --build -d
#
# IMPORTANT: always pass `-p pneumacare-prod` so this stack lives in its own
# Compose project and never reconciles against the dev stack (compose.yaml,
# project `pneumacare`). Without it, Compose will recreate/remove the dev
# app/postgres/redis containers.
#
# Brings up a FRESH Postgres (Flyway builds the schema on first boot), Redis,
# and the backend built from Dockerfile.prod. Secrets come from .env.prod
# (copy .env.prod.example). Do NOT reuse the dev database volume — the prod
# profile runs Flyway with ddl-auto=validate and expects a schema it owns.
#
# Tear down:  docker compose -p pneumacare-prod -f compose.prod.yaml down -v
# =============================================================================
name: pneumacare-prod

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: pneumacare-backend:prod
    container_name: pneumacare-app-prod
    env_file:
      - .env.prod
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # Force the app to listen on 8080 inside the container (matches the image
      # healthcheck). The host-side port is configurable via HOST_PORT below.
      APP_PORT: "8080"
      DB_HOST: postgres
      DB_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    ports:
      - "${HOST_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:17
    container_name: pneumacare-db-prod
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env.prod}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7.4
    container_name: pneumacare-redis-prod
    restart: unless-stopped

volumes:
  postgres_data_prod:
    driver: local
