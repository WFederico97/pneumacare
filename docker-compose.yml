# Local database environment — PostgreSQL 15 only.
# Usage:
#   cp .env.example .env   # adjust DB_NAME / DB_USER / DB_PASSWORD
#   docker-compose up -d
#
# For the full application stack (app + kafka + redis + grafana) use compose.yaml instead.

services:
  postgres:
    image: 'postgres:15'
    container_name: pneumacare-db
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME:-pneumacare}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_me}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-pneumacare}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
